[package]
name = "relayix"
version = "0.9.2"
edition = "2021"
license = "Apache-2.0"
description = "Self-hosted notification routing"

[dependencies]
base64 = "0.23.1"
axum = { version = "0.8.9", features = ["json", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "uuid", "chrono", "migrate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "form", "rustls"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
sha2 = "0.11.1"
hex = "0.4.3"
rand = "0.10.3"
tower-http = { version = "0.7.1", features = ["trace", "fs", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
subtle = "2.6.1"
url = "2.5.8"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
argon2 = { version = "0.6.0", features = ["getrandom"] }
chrono-tz = "0.10.4"
totp-rs = { version = "6.0.0", features = ["otpauth", "gen_secret"] }
