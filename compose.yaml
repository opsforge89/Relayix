name: relayix
services:
  app:
    container_name: ${COMPOSE_PROJECT_NAME:-relayix}-app
    image: ${RELAYIX_IMAGE_OVERRIDE:-ghcr.io/opsforge89/relayix:0.13.0}
    restart: unless-stopped
    stop_grace_period: 75s
    networks: [default]
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080'
    environment:
      DATABASE_URL: ${RELAYIX_DATABASE_URL:-}
      DATABASE_MODE: ${DATABASE_MODE:-local}
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-relayix}
      POSTGRES_DB: ${POSTGRES_DB:-relayix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-}
      POSTGRES_SSLROOTCERT: ${POSTGRES_CA_PATH:+/run/relayix/postgres-ca.crt}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SECRETS_KEY: ${SECRETS_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES-${RELAYIX_NETWORK_GATEWAY:-172.30.84.1}}
      OUTBOUND_ALLOWLIST: ${OUTBOUND_ALLOWLIST:-}
      WEBHOOK_RATE_LIMIT_PER_MINUTE: ${WEBHOOK_RATE_LIMIT_PER_MINUTE:-600}
      DELIVERY_PROXY_CONCURRENCY: ${DELIVERY_PROXY_CONCURRENCY:-2}
      DELIVERY_CHANNEL_CONCURRENCY: ${DELIVERY_CHANNEL_CONCURRENCY:-2}
      DELIVERY_WORKERS: ${DELIVERY_WORKERS:-4}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
      RUST_LOG: ${RUST_LOG:-relayix=info}
      PORT: '8080'
    volumes:
      - type: bind
        source: ${POSTGRES_CA_PATH:-/dev/null}
        target: /run/relayix/postgres-ca.crt
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
        required: false
  db:
    container_name: ${COMPOSE_PROJECT_NAME:-relayix}-db
    networks: [default]
    profiles: [local]
    image: ${POSTGRES_IMAGE:-postgres:17.11-trixie}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relayix}
      POSTGRES_DB: ${POSTGRES_DB:-relayix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  db_data:
    name: ${RELAYIX_DB_VOLUME:-${COMPOSE_PROJECT_NAME:-relayix}_db_data}
networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-relayix}-network
    ipam:
      config:
        - subnet: ${RELAYIX_NETWORK_SUBNET:-172.30.84.0/24}
          gateway: ${RELAYIX_NETWORK_GATEWAY:-172.30.84.1}
