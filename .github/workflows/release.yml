name: Release Docker image
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/check.yml
    with:
      source_ref: ${{ github.sha }}
    permissions:
      contents: read
      packages: write
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate version and determine image
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_VERSION: ${{ needs.verify.outputs.version }}
          CANDIDATE_IMAGE_REF: ${{ needs.verify.outputs.image_ref }}
        run: |
          python3 scripts/check_release.py
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Release requires a numeric semantic version'
          assert json.loads(Path('web/package.json').read_text())['version'] == version, 'Web version differs'
          assert os.environ['CANDIDATE_VERSION'] == version, 'Candidate version differs'
          expected = 'ghcr.io/' + os.environ['REPOSITORY'].lower() + '@sha256:'
          assert re.fullmatch(re.escape(expected) + '[0-9a-f]{64}', os.environ['CANDIDATE_IMAGE_REF']), 'Invalid candidate reference'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('image=ghcr.io/' + os.environ['REPOSITORY'].lower() + '\n')
              output.write('version=' + version + '\n')
          PY
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            if [[ "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Version $version is already tagged at another commit; bump Cargo.toml for a new release."
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            tag_object=$(gh api --method POST "repos/$GH_REPO/git/tags" \
              -f tag="$tag" -f message="Relayix $version Beta" \
              -f object="$(git rev-parse HEAD)" -f type=commit --jq .sha)
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$tag_object" >/dev/null
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        if: steps.release.outputs.publish == 'true'
      - uses: docker/login-action@v4
        if: steps.release.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested digest without rebuilding
        if: steps.release.outputs.publish == 'true'
        env:
          IMAGE_REF: ${{ needs.verify.outputs.image_ref }}
          IMAGE: ${{ needs.verify.outputs.image }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:beta" "$IMAGE_REF"
      - name: Publish standalone Compose downloads
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ ! -f relayix.env.example ]]; then
            echo "This historical tag has no standalone Compose bundle."
            exit 0
          fi
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --prerelease --title "Relayix $VERSION Beta" --generate-notes
          fi
          gh release upload "$tag" compose.yaml relayix.env.example --clobber
