name: Deploy release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published numeric version, for example 0.8.6
        required: true
        type: string
permissions:
  contents: read
  packages: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, relayix-deploy]
    environment: production
    timeout-minutes: 10
    steps:
      - name: Validate deployment configuration
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_DIRECTORY: ${{ vars.RELAYIX_DEPLOY_DIR }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$DEPLOY_DIRECTORY" == /* ]]
          test -x "$DEPLOY_DIRECTORY/scripts/compose.sh"
          test -f "$DEPLOY_DIRECTORY/scripts/write_config.py"
          test -x "$DEPLOY_DIRECTORY/scripts/deploy.sh"
      - name: Render private candidate from GitHub Secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.RELAYIX_POSTGRES_PASSWORD }}
          ADMIN_TOKEN: ${{ secrets.RELAYIX_ADMIN_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.RELAYIX_ADMIN_PASSWORD }}
          ADMIN_USERNAME: ${{ vars.RELAYIX_ADMIN_USERNAME }}
          BIND_ADDRESS: ${{ vars.RELAYIX_BIND_ADDRESS }}
          PORT: ${{ vars.RELAYIX_PORT }}
          COOKIE_SECURE: ${{ vars.RELAYIX_COOKIE_SECURE }}
          DATABASE_MODE: ${{ vars.RELAYIX_DATABASE_MODE }}
          POSTGRES_HOST: ${{ vars.RELAYIX_POSTGRES_HOST }}
          POSTGRES_PORT: ${{ vars.RELAYIX_POSTGRES_PORT }}
          POSTGRES_USER: ${{ vars.RELAYIX_POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.RELAYIX_POSTGRES_DB }}
          POSTGRES_SSLMODE: ${{ vars.RELAYIX_POSTGRES_SSLMODE }}
          POSTGRES_SSLROOTCERT: ${{ vars.RELAYIX_POSTGRES_SSLROOTCERT }}
          POSTGRES_IMAGE: ${{ vars.RELAYIX_POSTGRES_IMAGE }}
          POSTGRES_CLIENT_IMAGE: ${{ vars.RELAYIX_POSTGRES_CLIENT_IMAGE }}
          ALLOW_INSECURE_HTTP: ${{ vars.RELAYIX_ALLOW_INSECURE_HTTP }}
          RELAYIX_NETWORK_SUBNET: ${{ vars.RELAYIX_NETWORK_SUBNET }}
          RELAYIX_NETWORK_GATEWAY: ${{ vars.RELAYIX_NETWORK_GATEWAY }}
          WEBHOOK_RATE_LIMIT_PER_MINUTE: ${{ vars.RELAYIX_WEBHOOK_RATE_LIMIT_PER_MINUTE }}
          TRUSTED_PROXIES: ${{ vars.RELAYIX_TRUSTED_PROXIES }}
          OUTBOUND_ALLOWLIST: ${{ vars.RELAYIX_OUTBOUND_ALLOWLIST }}
          DELIVERY_WORKERS: ${{ vars.RELAYIX_DELIVERY_WORKERS }}
          EVENT_RETENTION_DAYS: ${{ vars.RELAYIX_EVENT_RETENTION_DAYS }}
          RUST_LOG: ${{ vars.RELAYIX_RUST_LOG }}
          RELAYIX_DB_VOLUME: ${{ vars.RELAYIX_DB_VOLUME }}
          TELEGRAM_API_ID: ${{ secrets.RELAYIX_TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.RELAYIX_TELEGRAM_API_HASH }}
          DEPLOY_DIRECTORY: ${{ vars.RELAYIX_DEPLOY_DIR }}
          CONFIG_FILE: ${{ vars.RELAYIX_CONFIG_FILE }}
        run: |
          test -n "$POSTGRES_PASSWORD"
          test -n "$ADMIN_TOKEN"
          test -n "$ADMIN_PASSWORD"
          config="${CONFIG_FILE:-$DEPLOY_DIRECTORY/../private/relayix-config/deployment.json}"
          candidate="$RUNNER_TEMP/relayix-candidate-$GITHUB_RUN_ID.json"
          python3 "$DEPLOY_DIRECTORY/scripts/write_config.py" "$candidate" --base "$config"
          printf 'RELAYIX_DEPLOY_CONFIG_CANDIDATE=%s\n' "$candidate" >> "$GITHUB_ENV"
          printf 'RELAYIX_CONFIG_FILE=%s\n' "$config" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/relayix-docker-auth"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Back up, deploy and check health
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_DIRECTORY: ${{ vars.RELAYIX_DEPLOY_DIR }}
          COMPOSE_PROJECT: ${{ vars.RELAYIX_COMPOSE_PROJECT }}
          HEALTH_URL: ${{ vars.RELAYIX_HEALTH_URL }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/relayix-docker-auth"
          export RELAYIX_DEPLOY_IMAGE="ghcr.io/${REPOSITORY,,}:$VERSION"
          export RELAYIX_EXPECTED_VERSION="$VERSION"
          export RELAYIX_COMPOSE_PROJECT="${COMPOSE_PROJECT:-relayix}"
          export RELAYIX_HEALTH_URL="${HEALTH_URL:-http://127.0.0.1:8080/healthz}"
          "$DEPLOY_DIRECTORY/scripts/deploy.sh"
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/relayix-docker-auth"
          rm -f -- "$RUNNER_TEMP/relayix-candidate-$GITHUB_RUN_ID.json"
