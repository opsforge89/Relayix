name: PR checks
on:
  pull_request:
    paths-ignore: ['docs/**', '*.md']
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pr-rust-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            pr-rust-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}-
            pr-rust-${{ runner.os }}-1.99.1-
      - name: Resolve attachment dependencies
        run: cargo +1.99.1 metadata --format-version 1 > /dev/null
      - name: Resolved lockfile
        uses: actions/upload-artifact@v7
        with:
          name: attachment-lockfile
          path: Cargo.lock
      - name: Rust formatting
        run: |
          if ! cargo +1.99.1 fmt --check; then
            cargo +1.99.1 fmt
            git diff --binary -- src > "$RUNNER_TEMP/rustfmt.patch"
            exit 1
          fi
      - name: Clippy
        run: cargo +1.99.1 clippy --locked --all-targets -- -D warnings
      - name: Rust unit tests
        run: cargo +1.99.1 test --locked
      - name: Formatting patch
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rustfmt-patch
          path: ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: ignore
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Python helper syntax
        run: python3 -m compileall -q scripts tests
      - name: OCI packaging unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
